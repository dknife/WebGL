    /* ===== Sutera 디자인 시스템 (알짜파이썬/DESIGN.md) ===== */
    :root {

      --text: #222222; --text-2: #313131; --text-light: #767676;

    .header .logo em { color: var(--accent); font-style: normal; }
    .header nav { margin-left: auto; display: flex; gap: 1.4rem; align-items: center; }
    .header nav a {
      color: var(--text-2); text-decoration: none; font-size: 0.88rem;
      font-weight: 500; transition: color 0.3s ease;
    }
    .header nav a:hover { color: var(--accent); }
    .header nav a.gh {
      background: var(--btn); color: #fff; padding: 0.35rem 1rem;
      border-radius: var(--radius); transition: background 0.3s ease;
    }
    .header nav a.gh:hover { background: var(--btn-hover); color: #fff; }

    /* ---- hero / search ---- */
    .top { max-width: 1100px; margin: 0 auto; padding: 120px 2rem 0; }
    .eyebrow {
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.18em;

    .searchbox {

      border: 1.5px solid var(--border); border-radius: 14px;

      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .searchbox:focus-within {
      border-color: var(--accent); box-shadow: 0 4px 18px rgba(250,93,41,0.12);

    .searchbox svg { flex: none; width: 20px; height: 20px; color: var(--text-light); }

      flex: 1; border: none; outline: none; background: transparent;

    .count { font-size: 0.82rem; color: var(--text-light); white-space: nowrap; }

    .cats { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.9rem; }
    .cat {
      font-size: 0.8rem; font-weight: 600; color: var(--text-2);
      background: var(--white); border: 1px solid var(--border);
      border-radius: 20px; padding: 0.32rem 0.95rem; cursor: pointer;

    /* ---- list ---- */
    .list { max-width: 1100px; margin: 0 auto; padding: 1rem 2rem 100px; }
    .fn {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;

    .fn:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .fn-head {
      display: flex; align-items: center; gap: 0.8rem; cursor: pointer;
      padding: 1.1rem 1.5rem; flex-wrap: wrap;
    }
    .fn-name {
      font-family: var(--mono); font-size: 1.08rem; font-weight: 700;
      color: var(--navy); letter-spacing: -0.01em;
    }
    .fn-name .obj { color: var(--text-light); font-weight: 500; }
    .fn-sig {
      font-family: var(--mono); font-size: 0.86rem; color: var(--text-light);
      flex: 1 1 auto; min-width: 0;
    }
    .tag {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
      padding: 0.18rem 0.55rem; border-radius: 20px; text-transform: uppercase;
      white-space: nowrap;
    }
    .tag.v2 { background: #e4f1fb; color: #0a6bb0; }
    .tag.cat { background: var(--bg-2); color: var(--text-2); }
    .chev { color: var(--text-light); transition: transform 0.25s ease; flex: none; }
    .fn.open .chev { transform: rotate(90deg); }

    .fn-body { display: none; padding: 0 1.5rem 1.4rem; }
    .fn.open .fn-body { display: block; }
    .fn-desc { color: var(--text-2); font-size: 0.96rem; margin: 0.2rem 0 1.1rem;
      padding-top: 1.1rem; border-top: 1px dashed var(--border); }
    .params-h { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-light); margin-bottom: 0.6rem; }
    table.params { width: 100%; border-collapse: collapse; }
    table.params td { padding: 0.5rem 0.6rem; vertical-align: top;
      border-bottom: 1px solid var(--bg-2); font-size: 0.92rem; }
    table.params tr:last-child td { border-bottom: none; }
    td.pname { font-family: var(--mono); font-weight: 600; color: var(--accent);
      white-space: nowrap; width: 1%; }
    td.ptype { font-family: var(--mono); font-size: 0.82rem; color: var(--cyan);
      white-space: nowrap; width: 1%; }
    td.pdesc { color: var(--text-2); }
    .noparams { color: var(--text-light); font-size: 0.9rem; font-style: italic; }
    .returns { margin-top: 1rem; font-size: 0.92rem; color: var(--text-2); }
    .returns b { color: var(--text); }
    .mdn { margin-top: 1rem; font-size: 0.85rem; }
    .mdn a { color: var(--cyan); text-decoration: none; }
    .mdn a:hover { text-decoration: underline; }
    mark { background: var(--yellow); color: var(--text); padding: 0 1px; border-radius: 2px; }
    .empty { text-align: center; color: var(--text-light); padding: 4rem 1rem; }
    .empty code { font-family: var(--mono); color: var(--accent); }

    footer { border-top: 1px solid var(--border); padding: 2.5rem 2rem;
      text-align: center; color: var(--text-light); font-size: 0.85rem; }
    footer a { color: var(--text-2); text-decoration: none; }
    footer a:hover { color: var(--accent); }

  <h1>WebGL <span class="accent">API 레퍼런스</span></h1>
  <p class="lead">함수 이름이나 설명을 검색하면 그 함수의 <strong>시그니처와 각 파라미터의 뜻</strong>을 한국어로 보여줍니다.
    예를 들어 <code>vertexAttribPointer</code>를 검색해 보세요. WebGL 2.0 전용 함수에는
    <span style="color:#0a6bb0;font-weight:700">2.0</span> 배지가 붙습니다.</p>

           stroke-linecap="round" stroke-linejoin="round">

      <input id="q" type="text" placeholder="함수 검색 — 예: vertexAttribPointer, bufferData, uniform, 텍스처…"

<script>
/* ===== WebGL / WebGL 2.0 함수 데이터 =====
   obj: 함수가 속한 객체(WebGLRenderingContext=gl, WebGL2=gl 2.0)
   v2: true면 WebGL 2.0 전용
   params: [이름, 타입, 설명]
*/
const API = [
/* ---------- 컨텍스트 · 상태 ---------- */
{name:"getContext", obj:"canvas", cat:"컨텍스트", sig:"canvas.getContext(type, attrs?)",
 desc:"캔버스로부터 WebGL 렌더링 컨텍스트를 얻는다. 모든 WebGL 호출의 시작점이다.",
 params:[["type","string","\"webgl\"(1.0) 또는 \"webgl2\"(2.0). WebGL 2.0 기능을 쓰려면 \"webgl2\"."],
         ["attrs","object?","컨텍스트 속성. {alpha, depth, stencil, antialias, premultipliedAlpha, preserveDrawingBuffer} 등."]],
 ret:"성공 시 WebGLRenderingContext / WebGL2RenderingContext, 실패 시 null."},
{name:"viewport", cat:"컨텍스트", sig:"gl.viewport(x, y, width, height)",
 desc:"정규화 장치 좌표(NDC)를 캔버스 픽셀로 변환할 뷰포트(그려질 직사각형 영역)를 지정한다. 보통 캔버스 크기와 같게 둔다.",
 params:[["x","GLint","뷰포트 좌하단 x (픽셀). 기본 0."],
         ["y","GLint","뷰포트 좌하단 y (픽셀). 기본 0."],
         ["width","GLsizei","뷰포트 너비(픽셀). 보통 gl.canvas.width."],
         ["height","GLsizei","뷰포트 높이(픽셀). 보통 gl.canvas.height."]]},
{name:"clearColor", cat:"컨텍스트", sig:"gl.clearColor(r, g, b, a)",
 desc:"gl.clear(COLOR_BUFFER_BIT)가 색 버퍼를 채울 배경색을 지정한다. 값은 0.0~1.0.",
 params:[["r","GLclampf","빨강 0.0~1.0"],["g","GLclampf","초록 0.0~1.0"],
         ["b","GLclampf","파랑 0.0~1.0"],["a","GLclampf","알파(불투명도) 0.0~1.0"]]},
{name:"clear", cat:"컨텍스트", sig:"gl.clear(mask)",
 desc:"지정한 버퍼들을 미리 설정한 clear 값으로 지운다. 매 프레임 렌더링을 시작할 때 호출한다.",
 params:[["mask","GLbitfield","지울 버퍼 비트의 OR 조합: gl.COLOR_BUFFER_BIT, gl.DEPTH_BUFFER_BIT, gl.STENCIL_BUFFER_BIT."]]},
{name:"enable", cat:"컨텍스트", sig:"gl.enable(cap)",
 desc:"특정 렌더링 기능을 켠다. 깊이 검사(DEPTH_TEST), 뒷면 제거(CULL_FACE), 블렌딩(BLEND) 등.",
 params:[["cap","GLenum","켤 기능: gl.DEPTH_TEST, gl.CULL_FACE, gl.BLEND, gl.SCISSOR_TEST, gl.STENCIL_TEST 등."]]},
{name:"disable", cat:"컨텍스트", sig:"gl.disable(cap)",
 desc:"enable로 켠 기능을 끈다. 인자는 enable과 동일.",
 params:[["cap","GLenum","끌 기능 상수(gl.DEPTH_TEST 등)."]]},
{name:"depthFunc", cat:"컨텍스트", sig:"gl.depthFunc(func)",
 desc:"깊이 검사에서 어떤 비교를 통과로 볼지 지정한다. 기본은 gl.LESS(더 가까우면 통과).",
 params:[["func","GLenum","비교 함수: gl.NEVER, LESS, EQUAL, LEQUAL, GREATER, NOTEQUAL, GEQUAL, ALWAYS."]]},
{name:"depthMask", cat:"컨텍스트", sig:"gl.depthMask(flag)",
 desc:"깊이 버퍼에 쓰기를 허용/차단한다. 반투명 물체를 그릴 때 false로 두기도 한다.",
 params:[["flag","GLboolean","true면 깊이 쓰기 허용(기본), false면 차단."]]},
{name:"blendFunc", cat:"컨텍스트", sig:"gl.blendFunc(sfactor, dfactor)",
 desc:"블렌딩이 켜졌을 때 원본(그리는 색)과 대상(이미 있는 색)을 섞는 계수를 정한다. 반투명 처리의 핵심.",
 params:[["sfactor","GLenum","원본 계수. 흔히 gl.SRC_ALPHA."],
         ["dfactor","GLenum","대상 계수. 흔히 gl.ONE_MINUS_SRC_ALPHA."]]},
{name:"blendFuncSeparate", cat:"컨텍스트", sig:"gl.blendFuncSeparate(srcRGB, dstRGB, srcA, dstA)",
 desc:"RGB 채널과 알파 채널의 블렌딩 계수를 따로 지정한다.",
 params:[["srcRGB","GLenum","RGB 원본 계수"],["dstRGB","GLenum","RGB 대상 계수"],
         ["srcA","GLenum","알파 원본 계수"],["dstA","GLenum","알파 대상 계수"]]},
{name:"cullFace", cat:"컨텍스트", sig:"gl.cullFace(mode)",
 desc:"CULL_FACE가 켜졌을 때 어느 면을 제거할지 정한다. 기본은 gl.BACK(뒷면 제거).",
 params:[["mode","GLenum","gl.BACK(뒷면), gl.FRONT(앞면), gl.FRONT_AND_BACK."]]},
{name:"frontFace", cat:"컨텍스트", sig:"gl.frontFace(mode)",
 desc:"어느 감김 방향을 앞면으로 볼지 정한다. 기본은 gl.CCW(반시계 방향이 앞면).",
 params:[["mode","GLenum","gl.CCW(반시계, 기본) 또는 gl.CW(시계)."]]},
{name:"pixelStorei", cat:"컨텍스트", sig:"gl.pixelStorei(pname, param)",
 desc:"픽셀 저장/읽기 방식을 설정한다. 이미지를 텍스처로 올릴 때 Y축 뒤집기에 자주 쓴다.",
 params:[["pname","GLenum","gl.UNPACK_FLIP_Y_WEBGL, gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, gl.UNPACK_ALIGNMENT 등."],
         ["param","GLint|GLboolean","설정 값(예: true 또는 1)."]]},
{name:"getParameter", cat:"컨텍스트", sig:"gl.getParameter(pname)",
 desc:"현재 컨텍스트의 상태 값을 조회한다. 최대 텍스처 크기, 버전 문자열 등을 얻는다.",
 params:[["pname","GLenum","조회할 상태: gl.MAX_TEXTURE_SIZE, gl.VERSION, gl.VENDOR, gl.MAX_VERTEX_ATTRIBS 등."]],
 ret:"pname에 따라 숫자·문자열·배열 등."},
{name:"getError", cat:"컨텍스트", sig:"gl.getError()",
 desc:"마지막 호출 이후 발생한 오류 코드를 하나 반환하고 지운다. 디버깅에 사용.",
 params:[],
 ret:"gl.NO_ERROR(0) 또는 INVALID_ENUM, INVALID_VALUE, INVALID_OPERATION, OUT_OF_MEMORY 등."},

/* ---------- 버퍼 ---------- */
{name:"createBuffer", cat:"버퍼", sig:"gl.createBuffer()",
 desc:"정점 데이터 등을 담을 GPU 버퍼 객체를 만든다.",
 params:[], ret:"WebGLBuffer 객체."},
{name:"bindBuffer", cat:"버퍼", sig:"gl.bindBuffer(target, buffer)",
 desc:"버퍼를 지정한 바인딩 지점에 묶는다. 이후의 bufferData 등은 이 버퍼에 적용된다.",
 params:[["target","GLenum","gl.ARRAY_BUFFER(정점 속성) 또는 gl.ELEMENT_ARRAY_BUFFER(인덱스). 2.0에선 UNIFORM_BUFFER 등도."],
         ["buffer","WebGLBuffer","묶을 버퍼. null을 주면 해제."]]},
{name:"bufferData", cat:"버퍼", sig:"gl.bufferData(target, srcData, usage)",
 desc:"현재 바인딩된 버퍼에 데이터를 올리고 저장소를 할당한다.",
 params:[["target","GLenum","gl.ARRAY_BUFFER 또는 gl.ELEMENT_ARRAY_BUFFER."],
         ["srcData","TypedArray","올릴 데이터(Float32Array, Uint16Array 등). 크기(바이트)만 줄 수도 있다."],
         ["usage","GLenum","사용 힌트: gl.STATIC_DRAW(한 번 올리고 여러 번 사용), DYNAMIC_DRAW, STREAM_DRAW."]]},
{name:"bufferSubData", cat:"버퍼", sig:"gl.bufferSubData(target, offset, srcData)",
 desc:"버퍼 저장소를 다시 할당하지 않고 일부만 갱신한다. 애니메이션에서 매 프레임 갱신할 때 유용.",
 params:[["target","GLenum","gl.ARRAY_BUFFER 등."],
         ["offset","GLintptr","갱신 시작 위치(바이트)."],
         ["srcData","TypedArray","덮어쓸 데이터."]]},
{name:"deleteBuffer", cat:"버퍼", sig:"gl.deleteBuffer(buffer)",
 desc:"버퍼 객체와 그 GPU 메모리를 해제한다.",
 params:[["buffer","WebGLBuffer","삭제할 버퍼."]]},

/* ---------- 정점 배열 객체(VAO) ---------- */
{name:"createVertexArray", obj:"gl 2.0", v2:true, cat:"VAO", sig:"gl.createVertexArray()",
 desc:"정점 속성 구성(어떤 버퍼를 어떻게 읽을지)을 통째로 저장하는 VAO를 만든다. WebGL 1.0에선 OES_vertex_array_object 확장 필요.",
 params:[], ret:"WebGLVertexArrayObject."},
{name:"bindVertexArray", obj:"gl 2.0", v2:true, cat:"VAO", sig:"gl.bindVertexArray(vao)",
 desc:"VAO를 활성화한다. 그리기 직전에 묶으면 저장해 둔 속성 구성이 한 번에 복원된다.",
 params:[["vao","WebGLVertexArrayObject","활성화할 VAO. null이면 기본 상태로."]]},
{name:"deleteVertexArray", obj:"gl 2.0", v2:true, cat:"VAO", sig:"gl.deleteVertexArray(vao)",
 desc:"VAO를 삭제한다.",
 params:[["vao","WebGLVertexArrayObject","삭제할 VAO."]]},

/* ---------- 정점 속성 ---------- */
{name:"getAttribLocation", cat:"정점 속성", sig:"gl.getAttribLocation(program, name)",
 desc:"셰이더 프로그램에서 이름으로 정점 속성(attribute/in)의 위치(인덱스)를 찾는다.",
 params:[["program","WebGLProgram","링크된 프로그램."],
         ["name","string","GLSL의 속성 변수 이름(예: \"aPosition\")."]],

 ret:"블록 인덱스(GLuint)."},
{name:"uniformBlockBinding", obj:"gl 2.0", v2:true, cat:"유니폼", sig:"gl.uniformBlockBinding(program, blockIndex, binding)",
 desc:"유니폼 블록을 특정 바인딩 포인트에 연결한다. 여러 셰이더가 같은 UBO를 공유할 때 사용.",
 params:[["program","WebGLProgram","프로그램."],["blockIndex","GLuint","블록 인덱스."],
         ["binding","GLuint","바인딩 포인트 번호."]]},
];

/* ===== 렌더링 & 검색 ===== */
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');
const catsEl = document.getElementById('cats');

// 카테고리 칩
const cats = ['전체', ...Array.from(new Set(API.map(f => f.cat)))];
let activeCat = '전체';
cats.forEach(c => {
  const el = document.createElement('span');
  el.className = 'cat' + (c === '전체' ? ' active' : '');
  el.textContent = c;
  el.onclick = () => {
    activeCat = c;
    [...catsEl.children].forEach(ch => ch.classList.toggle('active', ch.textContent === c));
    render();
  };
  catsEl.appendChild(el);
});

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hi(text, q){
  const e = esc(text);
  if(!q) return e;
  const i = e.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return e;
  return e.slice(0,i) + '<mark>' + e.slice(i, i+q.length) + '</mark>' + e.slice(i+q.length);
}

function matches(f, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(f.name.toLowerCase().includes(q)) return true;
  if(f.cat.toLowerCase().includes(q)) return true;
  if(f.desc.toLowerCase().includes(q)) return true;
  if((f.sig||'').toLowerCase().includes(q)) return true;
  return (f.params||[]).some(p => p[0].toLowerCase().includes(q) || p[2].toLowerCase().includes(q));
}

function render(){
  const q = qEl.value.trim();
  const rows = API.filter(f => (activeCat === '전체' || f.cat === activeCat) && matches(f, q))
                  .sort((a,b) => a.name.localeCompare(b.name));
  countEl.textContent = rows.length + '개';
  if(rows.length === 0){
    listEl.innerHTML = '<div class="empty">검색 결과가 없습니다. 함수 이름의 일부(예: <code>buffer</code>, <code>uniform</code>)로 다시 찾아보세요.</div>';
    return;
  }
  listEl.innerHTML = rows.map(f => {
    const obj = f.obj || 'gl';
    const v2 = f.v2 ? '<span class="tag v2">2.0</span>' : '';
    const params = (f.params && f.params.length)
      ? `<div class="params-h">파라미터</div><table class="params">${
          f.params.map(p => `<tr><td class="pname">${hi(p[0],q)}</td><td class="ptype">${esc(p[1])}</td><td class="pdesc">${hi(p[2],q)}</td></tr>`).join('')
        }</table>`
      : '<div class="params-h">파라미터</div><div class="noparams">파라미터 없음</div>';
    const ret = f.ret ? `<div class="returns"><b>반환값</b> — ${hi(f.ret,q)}</div>` : '';
    const mdn = `<div class="mdn">↗ <a href="https://developer.mozilla.org/ko/docs/Web/API/${obj.startsWith('gl 2')?'WebGL2RenderingContext':(obj==='canvas'?'HTMLCanvasElement':'WebGLRenderingContext')}/${f.name}" target="_blank">MDN에서 ${esc(f.name)} 보기</a></div>`;
    const objLabel = obj === 'canvas' ? 'canvas.' : 'gl.';
    return `<div class="fn">
      <div class="fn-head">
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        <span class="fn-name"><span class="obj">${objLabel}</span>${hi(f.name,q)}</span>
        <span class="fn-sig">${hi(f.sig,q)}</span>
        ${v2}<span class="tag cat">${esc(f.cat)}</span>
      </div>
      <div class="fn-body">
        <div class="fn-desc">${hi(f.desc,q)}</div>
        ${params}${ret}${mdn}
      </div>
    </div>`;
  }).join('');
  // 토글
  [...listEl.querySelectorAll('.fn-head')].forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle('open');
  });
  // 검색어가 있으면 자동 펼침
  if(q) [...listEl.querySelectorAll('.fn')].forEach(fn => fn.classList.add('open'));
}

qEl.addEventListener('input', render);
render();
</script>
</body>
</html>
