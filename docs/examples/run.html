<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예제 실행 · WebGL 3D 그래픽스</title>
<style>
  :root{--nav:#163864;--acc:#c86932;--bg:#f3f5f8;--card:#fff;--line:#dbe1ea;--code:#0f1420;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:#1c2430;display:flex;flex-direction:column}
  header{background:var(--nav);color:#fff;padding:12px 18px;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap}
  header b{font-size:1.08rem} header .sub{color:#c7d3e4;font-size:.85rem}
  header a{margin-left:auto;color:#ffd9c4;text-decoration:none;font-size:.9rem}
  header a:hover{text-decoration:underline}
  .wrap{flex:1;display:flex;min-height:0}
  aside{width:290px;background:var(--card);border-right:1px solid var(--line);
    overflow:auto;padding:8px 0}
  aside .grp{font-size:.78rem;font-weight:700;color:var(--nav);padding:10px 16px 4px}
  aside button{display:block;width:100%;text-align:left;border:0;background:none;
    padding:7px 16px;font-size:.86rem;color:#33424f;cursor:pointer;line-height:1.35}
  aside button:hover{background:#eef3f9}
  aside button.on{background:#e7eefb;color:var(--nav);font-weight:700;
    box-shadow:inset 3px 0 0 var(--acc)}
  aside .three{font-size:.68rem;color:#2c6b2c;margin-left:4px}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--card)}
  .bar .title{font-weight:700;color:var(--nav);font-size:.92rem;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .bar .sp{flex:1}
  .btn{border:0;border-radius:7px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.85rem}
  .btn.run{background:var(--acc);color:#fff} .btn.run:hover{filter:brightness(1.07)}
  .btn.ghost{background:#e9eef4;color:#33424f}
  .split{flex:1;display:flex;min-height:0}
  textarea{flex:1;width:50%;border:0;resize:none;padding:12px 14px;font-size:12.5px;
    line-height:1.5;font-family:'D2Coding','SF Mono',Menlo,Consolas,monospace;
    background:var(--code);color:#e6edf3;tab-size:2;white-space:pre;overflow:auto}
  .view{width:50%;border-left:1px solid var(--line);background:#111;display:flex;flex-direction:column}
  iframe{flex:1;width:100%;border:0;background:#111}
  .hint{padding:26px;color:#7b8794;font-size:.9rem;text-align:center}
  @media(max-width:820px){.split{flex-direction:column}textarea,.view{width:100%}
    aside{width:220px}}
</style></head>
<body>
<header>
  <b>예제 실행 <span class="sub">WebGL 3D 그래픽스</span></b>
  <a href="index.html">예제 다운로드 &rarr;</a>
</header>
<div class="wrap">
  <aside id="list"></aside>
  <main>
    <div class="bar">
      <span class="title" id="title">왼쪽에서 예제를 고르세요</span>
      <span class="sp"></span>
      <button class="btn ghost" id="reset" title="원본 코드로">↺ 초기화</button>
      <button class="btn run" id="run">▶ 실행 (Ctrl+Enter)</button>
    </div>
    <div class="split">
      <textarea id="code" spellcheck="false" placeholder="// 예제를 선택하면 코드가 여기에 나타납니다."></textarea>
      <div class="view"><iframe id="view" title="실행 결과"></iframe>
        <div class="hint" id="hint">▶ 실행을 누르면 결과가 여기에 표시됩니다.</div>
      </div>
    </div>
  </main>
</div>
<script src="examples.js"></script>
<script>
var GLMATRIX="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js";
var THREE="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js";
var EX = window.EXAMPLES || [], cur = -1;
var $=function(id){return document.getElementById(id)};

// 목록 구성 (그룹별)
(function(){
  var html="", lastG=null;
  EX.forEach(function(e,i){
    if(e.group!==lastG){ html+='<div class="grp">'+esc(e.group)+'</div>'; lastG=e.group; }
    html+='<button data-i="'+i+'">'+esc(e.no)+'. '+esc(e.cap)
        +(e.three?'<span class="three">3D</span>':'')+'</button>';
  });
  $("list").innerHTML=html;
  $("list").addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b)return; select(+b.getAttribute("data-i"));
  });
})();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function select(i){
  cur=i; var e=EX[i];
  Array.prototype.forEach.call($("list").querySelectorAll("button"),function(b){
    b.classList.toggle("on", +b.getAttribute("data-i")===i);
  });
  $("title").textContent=e.group+" · "+e.no+" — "+e.cap;
  $("code").value=e.code;
  run();
}
function buildDoc(code, three){
  var libs='<scr'+'ipt src="'+GLMATRIX+'"></scr'+'ipt>';
  if(three) libs+='<scr'+'ipt src="'+THREE+'"></scr'+'ipt>';
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>'
    +'html,body{margin:0;background:#111;color:#cdd6e0;'
    +'font-family:Menlo,Consolas,monospace}'
    +'canvas{display:block;margin:8px auto;background:#000}'
    +'#out{padding:6px 12px;font-size:12px;white-space:pre-wrap;'
    +'max-height:130px;overflow:auto;border-top:1px solid #222}'
    +'.err{color:#ff7b72}</style></head><body>'
    +'<canvas id="glCanvas" width="600" height="400"></canvas><div id="out"></div>'
    +libs
    +'<scr'+'ipt>(function(){var o=document.getElementById("out");'
    +'function w(c,a){var d=document.createElement("div");if(c)d.className=c;'
    +'d.textContent=Array.prototype.map.call(a,function(x){try{'
    +'return (x&&typeof x==="object")?JSON.stringify(x):String(x)}'
    +'catch(e){return String(x)}}).join(" ");o.appendChild(d)}'
    +'console.log=function(){w("",arguments)};'
    +'console.info=function(){w("",arguments)};'
    +'console.warn=function(){w("",arguments)};'
    +'console.error=function(){w("err",arguments)};'
    +'window.onerror=function(m){w("err",[m]);return false};})();</scr'+'ipt>'
    +'<scr'+'ipt>\ntry{\n'+code+'\n}catch(e){console.error(e&&e.message?e.message:e);}\n</scr'+'ipt>'
    +'</body></html>';
}
function run(){
  if(cur<0)return; var e=EX[cur];
  $("hint").style.display="none";
  var old=$("view"), f=document.createElement("iframe");
  f.id="view"; f.title="실행 결과";
  old.parentNode.replaceChild(f,old);      // 새 iframe으로 상태 초기화
  f.srcdoc=buildDoc($("code").value, e.three);
}
$("run").addEventListener("click",run);
$("reset").addEventListener("click",function(){ if(cur>=0){$("code").value=EX[cur].code; run();} });
$("code").addEventListener("keydown",function(ev){
  if((ev.ctrlKey||ev.metaKey)&&ev.key==="Enter"){ev.preventDefault();run();}
});
if(EX.length) select(0);
</script>
</body></html>
