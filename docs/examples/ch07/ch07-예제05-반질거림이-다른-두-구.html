<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch07 예제 5 — 반질거림이 다른 두 구</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');
const { mat4, vec3 } = glMatrix;

// ===== 퐁 셰이딩 셰이더 (코드 7.2와 동일) =====
const vsSource = `#version 300 es
layout(location = 0) in vec3 aPosition;
layout(location = 1) in vec3 aNormal;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
out vec3 vPosition;
out vec3 vNormal;
void main() {
    vec4 worldPos = uModel * vec4(aPosition, 1.0);
    gl_Position = uProj * uView * worldPos;
    vPosition = worldPos.xyz;
    vNormal = mat3(uModel) * aNormal;
}`;

const fsSource = `#version 300 es
precision mediump float;
in vec3 vPosition;
in vec3 vNormal;
uniform vec3 uLightDir;
uniform vec3 uEyePos;
uniform vec3 uLightColor;
uniform vec3 uMaterial;
uniform float uShininess;
out vec4 fragColor;
void main() {
    vec3 N = normalize(vNormal);
    vec3 L = normalize(uLightDir);
    vec3 V = normalize(uEyePos - vPosition);
    vec3 R = reflect(-L, N);
    float diff = max(dot(N, L), 0.0);
    float spec = pow(max(dot(R, V), 0.0), uShininess);
    vec3 color = 0.2 * uMaterial
               + diff * uLightColor * uMaterial
               + spec * uLightColor * vec3(1.0);
    fragColor = vec4(color, 1.0);
}`;

function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        console.log(gl.getProgramInfoLog(p));
    return p;
}

// ===== 위도-경도 분할로 구 만들기 =====
function makeSphere(r, nLat, nLon) {
    const pt = (i, j) => {
        const phi = Math.PI * i / nLat;
        const theta = 2.0 * Math.PI * j / nLon;
        return [r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)];
    };
    const pos = [], nrm = [];
    for (let i = 0; i < nLat; i++) {
        for (let j = 0; j < nLon; j++) {
            const quad = [pt(i, j),   pt(i+1, j), pt(i+1, j+1),
                          pt(i, j),   pt(i+1, j+1), pt(i, j+1)];
            for (const p of quad) {
                pos.push(p[0], p[1], p[2]);
                nrm.push(p[0]/r, p[1]/r, p[2]/r);
            }
        }
    }
    return { pos: new Float32Array(pos), nrm: new Float32Array(nrm) };
}

const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);

const sphere = makeSphere(0.9, 24, 48);
const vertexCount = sphere.pos.length / 3;
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const posVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posVbo);
gl.bufferData(gl.ARRAY_BUFFER, sphere.pos, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
const nrmVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, nrmVbo);
gl.bufferData(gl.ARRAY_BUFFER, sphere.nrm, gl.STATIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

// ===== MVP 행렬과 uniform =====
const eye = [0.0, 0.9, 4.2];        // 두 구가 보이도록 카메라를 뒤로
const model = mat4.create();
const view = mat4.create();
mat4.lookAt(view, eye, [0, 0, 0], [0, 1, 0]);
const proj = mat4.create();
mat4.perspective(proj, Math.PI/4, canvas.width/canvas.height, 0.1, 100);
gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uView'), false, view);
gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uProj'), false, proj);

const lightDir = vec3.fromValues(0.7, 0.9, 0.8);
vec3.normalize(lightDir, lightDir);
gl.uniform3fv(gl.getUniformLocation(program, 'uLightDir'), lightDir);
gl.uniform3fv(gl.getUniformLocation(program, 'uEyePos'), eye);
gl.uniform3f(gl.getUniformLocation(program, 'uLightColor'), 1.0, 1.0, 1.0);
gl.uniform3f(gl.getUniformLocation(program, 'uMaterial'), 0.2, 0.5, 0.9);

// ===== 그리기: 같은 구를 반질거림만 바꿔 두 번 =====
gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.1, 0.15, 0.25, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

const uModelLoc = gl.getUniformLocation(program, 'uModel');
const uShinLoc  = gl.getUniformLocation(program, 'uShininess');

mat4.fromTranslation(model, [-1.05, 0, 0]);   // 왼쪽: 무딘 광택
gl.uniformMatrix4fv(uModelLoc, false, model);
gl.uniform1f(uShinLoc, 8.0);
gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

mat4.fromTranslation(model, [1.05, 0, 0]);    // 오른쪽: 날카로운 광택
gl.uniformMatrix4fv(uModelLoc, false, model);
gl.uniform1f(uShinLoc, 128.0);
gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
</script>
</body></html>
