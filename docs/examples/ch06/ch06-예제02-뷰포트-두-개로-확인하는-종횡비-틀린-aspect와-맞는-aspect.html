<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch06 예제 2 — 뷰포트 두 개로 확인하는 종횡비 — 틀린 aspect와 맞는 aspect</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');

const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
uniform mat4 uView;
uniform mat4 uProjection;
void main() {
    gl_Position = uProjection * uView * aPosition;
}`;

const fsSource = `#version 300 es
precision mediump float;
out vec4 fragColor;
void main() {
    fragColor = vec4(1.0, 0.6, 0.2, 1.0);    // 주황색
}`;

// 2장의 도우미를 압축한 형태
function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        console.log(gl.getProgramInfoLog(p));
    return p;
}
const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);

// 한 변이 1인 정사각형 (xy 평면, TRIANGLE_STRIP)
const vertices = new Float32Array([
    -0.5, -0.5,    0.5, -0.5,    -0.5, 0.5,    0.5, 0.5,
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// 정면에서 바라보는 카메라
const { mat4 } = glMatrix;
const view = mat4.create();
mat4.lookAt(view, [0, 0, 2], [0, 0, 0], [0, 1, 0]);
gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uView'), false, view);
const uProjLoc = gl.getUniformLocation(program, 'uProjection');
const projection = mat4.create();

gl.clearColor(0.1, 0.15, 0.25, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);

// 왼쪽 절반(300x400): 캔버스 전체 비율 1.5를 그대로 쓴 잘못된 aspect
gl.viewport(0, 0, 300, 400);
mat4.perspective(projection, Math.PI / 4, 600 / 400, 0.1, 10.0);
gl.uniformMatrix4fv(uProjLoc, false, projection);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

// 오른쪽 절반: 뷰포트 자신의 비율 300/400에 맞춘 올바른 aspect
gl.viewport(300, 0, 300, 400);
mat4.perspective(projection, Math.PI / 4, 300 / 400, 0.1, 10.0);
gl.uniformMatrix4fv(uProjLoc, false, projection);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
</script>
</body></html>
