<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch02 예제 1 — 첫 번째 삼각형 그리기 (완성 프로그램)</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
// ===== 준비: 컨텍스트 =====
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');

// ===== 셰이더 소스 =====
const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
void main() {
    gl_Position = aPosition;
}`;

const fsSource = `#version 300 es
precision mediump float;
out vec4 fragColor;
void main() {
    fragColor = vec4(1.0, 0.6, 0.2, 1.0);   // 주황색
}`;

// ===== 셰이더 컴파일·링크 도우미 =====
function makeShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog(shader));
        return null;
    }
    return shader;
}
function makeProgram(gl, vsSource, fsSource) {
    const program = gl.createProgram();
    gl.attachShader(program, makeShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, makeShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.log(gl.getProgramInfoLog(program));
        return null;
    }
    return program;
}

// ===== 초기화 =====
function init() {
    const program = makeProgram(gl, vsSource, fsSource);
    gl.useProgram(program);                  // 프로그램 장착

    // 정점 데이터 (클립 공간 좌표)
    const vertices = new Float32Array([
         0.0,  0.6,
        -0.6, -0.6,
         0.6, -0.6,
    ]);

    // VAO + VBO 설정
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
}

// ===== 그리기 =====
function render() {
    gl.clearColor(0.1, 0.15, 0.25, 1.0);     // 배경: 짙은 남색
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);       // 정점 3개로 삼각형 그리기
}

init();
render();
</script>
</body></html>
