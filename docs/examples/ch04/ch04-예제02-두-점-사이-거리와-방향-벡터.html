<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch04 예제 2 — 두 점 사이 거리와 방향 벡터</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const { vec3 } = glMatrix;

const P = vec3.fromValues(1, 2, 3);
const Q = vec3.fromValues(4, 6, 3);

const dir = vec3.create();
vec3.subtract(dir, Q, P);            // Q - P = (3, 4, 0)
console.log('거리 =', vec3.length(dir));      // 5
vec3.normalize(dir, dir);
console.log('방향 =', dir);                   // (0.6, 0.8, 0)
// vec3.distance(P, Q)로 거리를 바로 구할 수도 있다
</script>
</body></html>
