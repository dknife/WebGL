<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch03 예제 2 — 정점마다 다른 색 — 보간되는 삼각형</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');

const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
layout(location = 1) in vec3 aColor;
out vec3 vColor;
void main() {
    gl_Position = aPosition;
    vColor = aColor;               // 색을 다음 단계로 넘긴다
}`;

const fsSource = `#version 300 es
precision mediump float;
in vec3 vColor;                    // 보간되어 도착한 색
out vec4 fragColor;
void main() {
    fragColor = vec4(vColor, 1.0);
}`;

function makeShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog(shader));
        return null;
    }
    return shader;
}
const program = gl.createProgram();
gl.attachShader(program, makeShader(gl, gl.VERTEX_SHADER, vsSource));
gl.attachShader(program, makeShader(gl, gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(program);
gl.useProgram(program);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// 0번 속성: 위치
const positions = new Float32Array([
     0.0,  0.6,   -0.6, -0.6,    0.6, -0.6,
]);
const posVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posVbo);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// 1번 속성: 정점 색 (꼭짓점 순서대로 빨강, 초록, 파랑)
const colors = new Float32Array([
    1.0, 0.0, 0.0,     // 위쪽 꼭짓점: 빨강
    0.0, 1.0, 0.0,     // 왼쪽 아래: 초록
    0.0, 0.0, 1.0,     // 오른쪽 아래: 파랑
]);
const colVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, colVbo);
gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

gl.clearColor(0.1, 0.15, 0.25, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body></html>
