<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch03 예제 4 — 슬라이더로 RGB 색 조절</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');

const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
void main() {
    gl_Position = aPosition;
}`;

const fsSource = `#version 300 es
precision mediump float;
uniform vec4 uColor;           // 모든 프래그먼트에 공통인 색
out vec4 fragColor;
void main() {
    fragColor = uColor;
}`;

// 정점·프래그먼트 셰이더를 컴파일해 하나의 프로그램으로 링크한다
function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.log(gl.getProgramInfoLog(p));
    return p;
}
const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);

const vertices = new Float32Array([
     0.0,  0.6,   -0.6, -0.6,    0.6, -0.6,
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const uColorLoc = gl.getUniformLocation(program, 'uColor');
const rgb = [1.0, 0.2, 0.4];        // 현재 색 (초깃값)

function render() {
    gl.uniform4f(uColorLoc, rgb[0], rgb[1], rgb[2], 1.0);
    gl.clearColor(0.1, 0.15, 0.25, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// R, G, B 슬라이더 3개를 만들어 캔버스 아래에 붙인다
['R', 'G', 'B'].forEach((name, i) => {
    const slider = document.createElement('input');
    slider.type = 'range';                  // 0~100 슬라이더
    slider.value = rgb[i] * 100;
    slider.style.cssText = 'display:block; width:300px; margin:6px auto;';
    // 슬라이더를 움직이면 해당 성분을 갱신하고 다시 그린다
    slider.addEventListener('input', () => {
        rgb[i] = slider.value / 100;
        render();
    });
    document.body.appendChild(slider);
});

render();
</script>
</body></html>
