<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch08 예제 4 — 반투명 사각형 겹쳐 그리기</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const gl = glCanvas.getContext('webgl2', { antialias: true });
const vs = `#version 300 es
layout(location=0) in vec2 p; uniform vec2 uOff; uniform float uAspect;
void main(){ gl_Position = vec4(p.x+uOff.x, (p.y+uOff.y)*uAspect, 0.0, 1.0); }`;
const fs = `#version 300 es
precision highp float; uniform vec4 uColor; out vec4 o;
void main(){ o = uColor; }`;
function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); return o; }
const pr=gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);

const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-0.5,-0.5, 0.5,-0.5, -0.5,0.5, 0.5,0.5]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.uniform1f(gl.getUniformLocation(pr,'uAspect'), glCanvas.width/glCanvas.height);

gl.clearColor(0.12,0.13,0.16,1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.enable(gl.BLEND);                                   // 블렌딩 켜기
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);    // 표준 알파 합성

const uC=gl.getUniformLocation(pr,'uColor'), uO=gl.getUniformLocation(pr,'uOff');
const quads=[[-0.30,0.10, 1.0,0.25,0.30],[0.0,-0.05, 0.20,0.85,0.35],
             [0.30,0.10, 0.25,0.45,1.0],[0.0,0.22, 1.0,0.85,0.20]];
for(const q of quads){
  gl.uniform2f(uO, q[0], q[1]);
  gl.uniform4f(uC, q[2], q[3], q[4], 0.55);            // 알파 0.55
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
</script>
</body></html>
