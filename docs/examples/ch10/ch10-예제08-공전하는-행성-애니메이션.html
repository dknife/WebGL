<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch10 예제 8 — 공전하는 행성 애니메이션</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');
const { mat4 } = glMatrix;

// ----- 셰이더: 색을 uniform으로 받는다 (정점 색 대신 uColor, 3장) -----
const vsSource = `#version 300 es
layout(location = 0) in vec3 aPosition;
uniform mat4 uProjection, uView, uModel;
void main() {
    gl_Position = uProjection * uView * uModel * vec4(aPosition, 1.0);
}`;

const fsSource = `#version 300 es
precision mediump float;
uniform vec3 uColor;
out vec4 fragColor;
void main() {
    fragColor = vec4(uColor, 1.0);
}`;

// 셰이더 도우미 (2장의 도우미를 압축한 형태)
function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        console.log(gl.getProgramInfoLog(p));
    return p;
}

const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);

// ----- 정육면체 (코드 10.2의 위치·인덱스, 색은 uniform으로) -----
const positions = new Float32Array([
    -0.5, -0.5, -0.5,     0.5, -0.5, -0.5,
     0.5,  0.5, -0.5,    -0.5,  0.5, -0.5,
    -0.5, -0.5,  0.5,     0.5, -0.5,  0.5,
     0.5,  0.5,  0.5,    -0.5,  0.5,  0.5,
]);
const indices = new Uint16Array([
    4, 5, 6,   4, 6, 7,      5, 1, 2,   5, 2, 6,
    1, 0, 3,   1, 3, 2,      0, 4, 7,   0, 7, 3,
    7, 6, 2,   7, 2, 3,      0, 1, 5,   0, 5, 4,
]);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const posVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posVbo);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
const ebo = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

const uProjLoc  = gl.getUniformLocation(program, 'uProjection');
const uViewLoc  = gl.getUniformLocation(program, 'uView');
const uModelLoc = gl.getUniformLocation(program, 'uModel');
const uColorLoc = gl.getUniformLocation(program, 'uColor');
const projection = mat4.create();
mat4.perspective(projection, Math.PI / 4,
                 canvas.width / canvas.height, 0.1, 100);
const view = mat4.create();
mat4.lookAt(view, [2.5, 2.5, 5], [0, 0, 0], [0, 1, 0]);
gl.uniformMatrix4fv(uProjLoc, false, projection);
gl.uniformMatrix4fv(uViewLoc, false, view);
gl.enable(gl.DEPTH_TEST);

// ----- 태양과 공전하는 행성 -----
const model = mat4.create();
const orbit = mat4.create();
let prevTime = 0, theta = 0;         // theta: 행성의 공전각

function render(time) {
    const dt = (time - prevTime) * 0.001;
    prevTime = time;
    theta += 1.0 * dt;               // 초당 1라디안으로 공전

    gl.clearColor(0.05, 0.05, 0.1, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // 1) 태양: 원점에 큰 정육면체
    mat4.fromScaling(model, [0.6, 0.6, 0.6]);
    gl.uniform3f(uColorLoc, 1.0, 0.8, 0.1);        // 노랑
    gl.uniformMatrix4fv(uModelLoc, false, model);
    gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);

    // 2) 행성: 공전각 회전 → 궤도로 이동 → 축소 (오른쪽부터 적용)
    mat4.fromYRotation(orbit, theta);              // 공전각
    mat4.translate(orbit, orbit, [1.5, 0, 0]);     // 궤도 반지름
    mat4.scale(model, orbit, [0.25, 0.25, 0.25]);  // 행성 크기
    gl.uniform3f(uColorLoc, 0.3, 0.5, 1.0);        // 파랑
    gl.uniformMatrix4fv(uModelLoc, false, model);
    gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);

    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body></html>
