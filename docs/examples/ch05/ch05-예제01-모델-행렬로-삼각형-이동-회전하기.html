<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch05 예제 1 — 모델 행렬로 삼각형 이동·회전하기</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');
const { mat4 } = glMatrix;

// ===== 셰이더: 정점마다 uModel을 곱한다 =====
const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
uniform mat4 uModel;                    // 모델 변환 행렬
void main() {
    gl_Position = uModel * aPosition;   // 행렬 곱 = 변환 적용
}`;

const fsSource = `#version 300 es
precision mediump float;
out vec4 fragColor;
void main() {
    fragColor = vec4(1.0, 0.6, 0.2, 1.0);   // 주황색
}`;

// ===== 셰이더 도우미 (2장의 도우미 압축판) =====
function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        console.log(gl.getProgramInfoLog(p));
    return p;
}

const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);
const uModelLoc = gl.getUniformLocation(program, 'uModel');

// ===== 원점 주변의 삼각형 =====
const vertices = new Float32Array([
     0.0,  0.3,   -0.3, -0.3,    0.3, -0.3,
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ===== 모델 행렬: 30도 회전한 뒤 (0.4, 0.3)만큼 이동 =====
const R = mat4.create();
const T = mat4.create();
const model = mat4.create();
mat4.fromZRotation(R, 30 * Math.PI / 180);
mat4.fromTranslation(T, [0.4, 0.3, 0]);
mat4.multiply(model, T, R);              // model = T x R

gl.uniformMatrix4fv(uModelLoc, false, model);

gl.clearColor(0.1, 0.15, 0.25, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body></html>
