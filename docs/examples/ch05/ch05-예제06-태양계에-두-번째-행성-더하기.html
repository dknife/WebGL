<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch05 예제 6 — 태양계에 두 번째 행성 더하기</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');
const { mat4 } = glMatrix;

const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
uniform mat4 uModel;
void main() {
    gl_Position = uModel * aPosition;
}`;

const fsSource = `#version 300 es
precision mediump float;
uniform vec4 uColor;
out vec4 fragColor;
void main() {
    fragColor = uColor;
}`;

// ===== 셰이더 도우미 (2장의 도우미 압축판) =====
function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        console.log(gl.getProgramInfoLog(p));
    return p;
}

const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);
const uModelLoc = gl.getUniformLocation(program, 'uModel');
const uColorLoc = gl.getUniformLocation(program, 'uColor');

// ===== 사각형 하나: TRIANGLE_STRIP 정점 4개 (한 변 1) =====
const vertices = new Float32Array([
    -0.5, -0.5,    0.5, -0.5,   -0.5,  0.5,    0.5,  0.5,
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const drawM = mat4.create();
function drawSquare(m, s, r, g, b) {
    mat4.scale(drawM, m, [s, s, 1]);
    gl.uniformMatrix4fv(uModelLoc, false, drawM);
    gl.uniform4f(uColorLoc, r, g, b, 1.0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

gl.clearColor(0.05, 0.05, 0.12, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);

// ----- 태양: 세계의 중심 -----
const sunM = mat4.create();
drawSquare(sunM, 0.5, 1.0, 0.8, 0.2);       // 노란 태양

// ----- 첫 행성: 태양에서 30도 방향으로 0.65 -----
const planetM = mat4.clone(sunM);
mat4.rotateZ(planetM, planetM, 30 * Math.PI / 180);
mat4.translate(planetM, planetM, [0.65, 0, 0]);
drawSquare(planetM, 0.2, 0.3, 0.6, 1.0);    // 파란 행성

// ----- 두 번째 행성: 태양 좌표계를 "다시" 복사한다 -----
const planet2M = mat4.clone(sunM);          // planetM이 아니라 sunM에서 출발!
mat4.rotateZ(planet2M, planet2M, -120 * Math.PI / 180);
mat4.translate(planet2M, planet2M, [0.8, 0, 0]);
drawSquare(planet2M, 0.15, 1.0, 0.4, 0.35); // 붉은 행성
</script>
</body></html>
