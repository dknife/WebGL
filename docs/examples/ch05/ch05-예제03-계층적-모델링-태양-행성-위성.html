<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>ch05 예제 3 — 계층적 모델링 — 태양, 행성, 위성</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="glCanvas" width="600" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');
const { mat4 } = glMatrix;

const vsSource = `#version 300 es
layout(location = 0) in vec4 aPosition;
uniform mat4 uModel;
void main() {
    gl_Position = uModel * aPosition;
}`;

const fsSource = `#version 300 es
precision mediump float;
uniform vec4 uColor;
out vec4 fragColor;
void main() {
    fragColor = uColor;
}`;

// ===== 셰이더 도우미 (2장의 도우미 압축판) =====
function makeProgram(gl, vsSource, fsSource) {
    function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.log(gl.getShaderInfoLog(s));
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        console.log(gl.getProgramInfoLog(p));
    return p;
}

const program = makeProgram(gl, vsSource, fsSource);
gl.useProgram(program);
const uModelLoc = gl.getUniformLocation(program, 'uModel');
const uColorLoc = gl.getUniformLocation(program, 'uColor');

// ===== 사각형 하나: TRIANGLE_STRIP 정점 4개 (한 변 1) =====
const vertices = new Float32Array([
    -0.5, -0.5,    0.5, -0.5,   -0.5,  0.5,    0.5,  0.5,
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// 좌표계 행렬 m에 크기 s를 곱해 색 (r, g, b)의 사각형을 그린다
const drawM = mat4.create();             // 그리기 직전에만 쓰는 행렬
function drawSquare(m, s, r, g, b) {
    mat4.scale(drawM, m, [s, s, 1]);     // 크기는 좌표계에 물려주지 않는다
    gl.uniformMatrix4fv(uModelLoc, false, drawM);
    gl.uniform4f(uColorLoc, r, g, b, 1.0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

gl.clearColor(0.05, 0.05, 0.12, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);

// ----- 태양: 세계의 중심 -----
const sunM = mat4.create();              // 태양 좌표계 = 원점
drawSquare(sunM, 0.5, 1.0, 0.8, 0.2);    // 노란 태양

// ----- 행성: 태양 좌표계에서 30도 방향으로 0.65 떨어진 곳 -----
const planetM = mat4.clone(sunM);        // 부모 좌표계를 복사해서 출발
mat4.rotateZ(planetM, planetM, 30 * Math.PI / 180);
mat4.translate(planetM, planetM, [0.65, 0, 0]);
drawSquare(planetM, 0.2, 0.3, 0.6, 1.0); // 파란 행성

// ----- 위성: "행성" 좌표계에서 60도 방향으로 0.25 떨어진 곳 -----
const moonM = mat4.clone(planetM);       // 부모는 태양이 아니라 행성!
mat4.rotateZ(moonM, moonM, 60 * Math.PI / 180);
mat4.translate(moonM, moonM, [0.25, 0, 0]);
drawSquare(moonM, 0.1, 0.85, 0.85, 0.85);  // 회색 위성
</script>
</body></html>
